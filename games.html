<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERETHEUM / games</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px 20px 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-size:12px;letter-spacing:5px;color:#ddd}.back{color:#777;text-decoration:none;font-size:11px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.search,.select{background:#080808;border:1px solid #222;color:#fff;border-radius:999px;padding:11px 14px;outline:none}.search{flex:1;min-width:220px}.select{min-width:130px}.count{color:#555;font-size:10px;letter-spacing:2px;margin:12px 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:13px}.card{background:#090909;border:1px solid #191919;border-radius:12px;overflow:hidden;position:relative;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#444}.card a{text-decoration:none;color:#fff}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.info{padding:11px 12px}.title{font-size:12px}.tag{font-size:9px;color:#666;margin-top:5px}.fav{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;border:1px solid #333;background:#050505;color:#aaa;cursor:pointer}.fav.on{color:#fff;border-color:#777}.empty{color:#444;font-size:11px;letter-spacing:1px;padding:30px 0}.section-title{font-size:10px;letter-spacing:4px;color:#666;margin:8px 0}
</style></head><body><div class="wrap"><div class="top"><a class="back" href="index.html">← home</a><div class="brand">ERETHEUM / GAMES</div></div><div class="tools"><input id="search" class="search" placeholder="search games..." aria-label="Search games"><select id="category" class="select"><option value="">all categories</option></select><button id="random" class="select">random ↗</button></div><div class="section-title">LIBRARY</div><div id="count" class="count"></div><div class="grid" id="grid"></div></div>
<script src="system/games.js"></script><script>
const favKey="erethreum-favorites",getFav=()=>{try{return JSON.parse(localStorage.getItem(favKey)||"[]")}catch{return[]}},saveFav=a=>localStorage.setItem(favKey,JSON.stringify(a));const grid=document.getElementById("grid"),search=document.getElementById("search"),cat=document.getElementById("category"),count=document.getElementById("count");[...new Set(games.map(g=>g.tag))].sort().forEach(x=>cat.insertAdjacentHTML("beforeend",'<option>'+x+'</option>'));if(new URLSearchParams(location.search).get("filter")==="favorites")cat.insertAdjacentHTML("afterbegin",'<option value="__favorites">favorites</option>'),cat.value="__favorites";
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#39;"}[c]))}
function render(){const q=search.value.toLowerCase().trim(),c=cat.value,f=getFav();let list=games.filter(g=>(g.title+" "+g.tag).toLowerCase().includes(q));if(c==="__favorites")list=list.filter(g=>f.includes(g.id));else if(c)list=list.filter(g=>g.tag===c);count.textContent=list.length+" GAMES";grid.innerHTML=list.map(g=>'<div class="card"><a href="play.html?id='+encodeURIComponent(g.id)+'"><img class="thumb" src="https://cdn.jsdelivr.net/gh/3kh0/3kh0-lite@main/'+g.image+'" alt="" loading="lazy"><div class="info"><div class="title">'+esc(g.title)+'</div><div class="tag">'+esc(g.tag)+'</div></div></a><button class="fav '+(f.includes(g.id)?"on":"")+'" data-id="'+g.id+'">'+(f.includes(g.id)?"★":"☆")+'</button></div>').join("")||'<div class="empty">NO GAMES FOUND.</div>';document.querySelectorAll(".fav").forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();let a=getFav();a=a.includes(b.dataset.id)?a.filter(x=>x!==b.dataset.id):[...a,b.dataset.id];saveFav(a);render()})}
search.addEventListener("input",render);cat.addEventListener("change",render);document.getElementById("random").onclick=()=>{const g=games[Math.floor(Math.random()*games.length)];location.href="play.html?id="+g.id};render();
</script></body></html>
