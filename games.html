<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERETHREUM / games</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}a{color:#aaa;text-decoration:none;font-size:12px}a:hover{color:#fff}.topbar{padding:16px 20px;display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;padding:20px}.card{background:#111;border:1px solid #222;border-radius:10px;overflow:hidden;text-decoration:none;color:#fff;transition:.2s}.card:hover{transform:scale(1.03);border-color:#444}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.info{padding:10px}.title{font-size:13px}.tag{font-size:10px;color:#777;margin-top:6px}.search{background:#0a0a0a;border:1px solid #222;color:#fff;padding:10px 12px;border-radius:8px;outline:none;width:min(360px,90%);margin:20px}
</style></head><body>
<div class="topbar"><a href="index.html">← home</a><div>ERETHREUM / games</div></div>
<input id="search" class="search" placeholder="search games..." aria-label="Search games"><div class="grid" id="grid"></div>
<script src="system/games.js"></script><script>
const grid=document.getElementById("grid"),search=document.getElementById("search");
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function render(){const q=search.value.toLowerCase().trim();const list=games.filter(g=>(g.title+" "+g.tag).toLowerCase().includes(q));grid.innerHTML=list.map(g=>'<a class="card" href="play.html?id='+encodeURIComponent(g.id)+'"><img class="thumb" src="https://cdn.jsdelivr.net/gh/3kh0/3kh0-lite@main/'+g.image+'" alt="" loading="lazy"><div class="info"><div class="title">'+esc(g.title)+'</div><div class="tag">'+esc(g.tag)+'</div></div></a>').join("")||'<p style="color:#777">No games found.</p>'}
search.addEventListener("input",render);render();
</script></body></html>
