<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Games — ERETHREUM</title><link rel="stylesheet" href="styles/style.css"></head><body><header><a class="logo" href="index.html">ERETHREUM</a><nav><a href="index.html">Home</a><a class="active" href="games.html">Games</a></nav></header><main><section class="page-title"><p class="eyebrow">THE ARCADE</p><h1>GAME LIBRARY.</h1><p class="lead">A curated browser-game collection, wired through the same local game routing pattern as ERETHREUM.</p><input id="search" class="search" placeholder="Search games..." aria-label="Search games"></section><section class="section"><div id="grid" class="cards"></div></section></main><footer>© 2026 ERETHREUM · Games from 3kh0-lite credited to 3kh0</footer><script src="system/games.js"></script><script>const grid=document.getElementById("grid"),search=document.getElementById("search");function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}function render(){const q=search.value.toLowerCase().trim();const list=games.filter(g=>(g.title+" "+g.tag).toLowerCase().includes(q));grid.innerHTML=list.map(g=>'<a class="card game-card" href="play.html?id='+encodeURIComponent(g.id)+'"><div class="thumb game-thumb"><img src="https://cdn.jsdelivr.net/gh/3kh0/3kh0-lite@main/'+g.image+'" alt="" loading="lazy"></div><h2>'+esc(g.title)+'</h2><p>Play now →</p></a>').join("")||'<p style="color:#777">No games found.</p>'}search.addEventListener("input",render);render();</script></body></html>
