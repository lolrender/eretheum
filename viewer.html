<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERETHEUM / web</title><script src="system/theme.js"></script><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;overflow:hidden}.shell{height:100%;display:flex;flex-direction:column}.top{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--border);background:var(--panel)}button,a{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:999px;padding:8px 11px;font-size:10px;text-decoration:none;cursor:pointer}button:hover,a:hover{color:var(--text);border-color:var(--accent)}#address{flex:1;min-width:0;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:10px 14px;color:var(--text);outline:0}#address:focus{border-color:var(--accent)}iframe{flex:1;width:100%;border:0;background:#fff}.brand{letter-spacing:3px;font-size:10px;padding:0 4px}@media(max-width:650px){.brand{display:none}.top{padding:8px;gap:5px}button,a{padding:8px}.top button:nth-of-type(2){display:none}}</style></head><body><div class="shell"><div class="top"><a href="apps.html">← APPS</a><div class="brand">ERETHEUM</div><button id="back">←</button><button id="forward">→</button><button id="reload">↻</button><input id="address" spellcheck="false" autocomplete="off"><button id="go">GO</button></div><iframe id="frame" referrerpolicy="no-referrer"></iframe></div><script>const endpoint=localStorage.getItem("eretheum-proxy-endpoint")||"https://eretheum.jadenp7500.workers.dev";const address=document.getElementById("address"),frame=document.getElementById("frame");let history=[],pos=-1;function target(raw){let q=raw.trim();if(!q)return "https://www.google.com/";if(!/^https?:\/\//i.test(q))q=/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(q)?"https://"+q:"https://www.google.com/search?q="+encodeURIComponent(q);return q}function load(raw,add=true){const u=target(raw);address.value=u;if(add){history=history.slice(0,pos+1);history.push(u);pos=history.length-1}if(endpoint)frame.src=endpoint.replace(/\/$/,"")+"/?url="+encodeURIComponent(u);else frame.src=u}document.getElementById("go").onclick=()=>load(address.value);address.onkeydown=e=>{if(e.key==="Enter")load(address.value)};document.getElementById("reload").onclick=()=>{if(frame.src)frame.src=frame.src};document.getElementById("back").onclick=()=>{if(pos>0){pos--;load(history[pos],false)}};document.getElementById("forward").onclick=()=>{if(pos<history.length-1){pos++;load(history[pos],false)}};const initial=new URLSearchParams(location.search).get("url")||localStorage.getItem("eretheum-proxy-url")||"https://www.google.com/";load(initial);</script></body></html>
