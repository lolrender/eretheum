<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERETHREUM — GAME</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#070707;overflow:hidden}
#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#070707}
.top{position:fixed;z-index:9999;top:12px;left:12px;display:flex;gap:10px}
.top a{padding:9px 13px;border-radius:5px;text-decoration:none;font:700 12px system-ui;letter-spacing:.08em}
.brand{background:#8cff42;color:#071000}
.home{background:#111;color:#8cff42;border:1px solid #8cff42}
#status{position:fixed;z-index:9998;inset:0;display:grid;place-items:center;color:#8cff42;font:700 16px system-ui;background:#070707}
</style>
</head>
<body>
<div id="status">LOADING GAME...</div>
<div class="top">
<a class="brand" href="index.html">ERETHREUM</a>
<a class="home" href="games.html">← GAMES</a>
</div>
<iframe id="game" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write" allowfullscreen></iframe>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const source = params.get("game");
  const status = document.getElementById("status");
  const frame = document.getElementById("game");

  if (!source || !/^projects\/[A-Za-z0-9._-]+\/index\.html$/.test(source)) {
    location.replace("games.html");
    return;
  }

  // Load the original game through a browser-friendly proxy.
  const urls = [
    "https://raw.githack.com/lolrender/3kh0-lite/main/" + source,
    "https://cdn.jsdelivr.net/gh/lolrender/3kh0-lite@main/" + source
  ];

  let attempt = 0;
  function load() {
    status.textContent = "LOADING GAME...";
    frame.src = urls[attempt];
  }

  frame.addEventListener("load", () => {
    status.style.display = "none";
  });

  frame.addEventListener("error", () => {
    if (++attempt < urls.length) load();
    else status.textContent = "GAME COULD NOT LOAD — GO BACK TO GAMES";
  });

  load();
})();
</script>
</body>
</html>
