<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERETHREUM</title><script src="system/theme.js"></script><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}body{background-image:radial-gradient(circle at 50% 12%,color-mix(in srgb,var(--accent) 7%,transparent),transparent 34%),radial-gradient(circle at 15% 70%,color-mix(in srgb,var(--accent) 3%,transparent),transparent 28%),radial-gradient(circle at 85% 85%,color-mix(in srgb,var(--accent) 3%,transparent),transparent 28%);background-attachment:fixed}body{overflow-x:hidden;opacity:0;transition:opacity .4s}.loaded{opacity:1}#stars{position:fixed;inset:0;z-index:0;pointer-events:none}.star{position:absolute;background:var(--star);border-radius:50%;opacity:.35;animation:twinkle 4s infinite ease-in-out}@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.48}}#boot{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10;transition:opacity .5s}.logo{font-size:42px;letter-spacing:14px}.slogan{margin-top:12px;font-size:14px;letter-spacing:3px;color:#a0a0a0}.progress{width:180px;height:1px;background:var(--border);margin-top:25px}.bar{width:0;height:100%;background:var(--accent);animation:load 2s linear forwards}@keyframes load{to{width:100%}}main{position:relative;z-index:2;min-height:100vh;padding:24px}.nav{display:flex;justify-content:space-between;align-items:center}.brand{font-size:12px;letter-spacing:5px}.links{display:flex;gap:8px}.pill{border:1px solid var(--border);border-radius:999px;padding:9px 13px;color:var(--muted);text-decoration:none;font-size:10px;letter-spacing:1.5px;transition:.2s;background:transparent}.pill:hover{color:var(--text);border-color:var(--accent);transform:translateY(-1px)}.hero{min-height:55vh;display:grid;place-items:center;text-align:center}.hero h1{font-size:clamp(48px,9vw,84px);letter-spacing:18px;font-weight:300;margin:0}.sub{margin-top:12px;font-size:12px;letter-spacing:5px;color:#a0a0a0}.actions{display:flex;justify-content:center;gap:8px;margin-top:24px;flex-wrap:wrap}.primary{color:var(--text);border-color:var(--accent)}.section{max-width:1100px;margin:0 auto 64px;padding-top:8px}.section+.section{border-top:1px solid var(--border);padding-top:34px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.section h2{font-size:11px;letter-spacing:4px;font-weight:400;color:var(--muted)}.section a.more{font-size:10px;color:var(--muted);text-decoration:none}.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px}.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;color:var(--text);text-decoration:none;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;position:relative}.card a{display:block;color:inherit;text-decoration:none}.card:hover{transform:translateY(-5px) scale(1.02);box-shadow:0 0 25px color-mix(in srgb,var(--accent) 12%,transparent);border-color:var(--accent)}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;filter:grayscale(.2)}.card-info{padding:10px 12px}.title{font-size:13px}.tag{font-size:9px;color:var(--muted);margin-top:5px}.empty{color:var(--muted);font-size:11px}.version{position:fixed;right:14px;bottom:10px;color:#666;font-size:9px;letter-spacing:2px}@media(max-width:900px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:600px){main{padding:16px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.links .pill:first-child{display:none}.hero{min-height:58vh}.hero h1{letter-spacing:9px}} </style></head><body><div id="stars"></div><div id="boot"><div class="logo">erethreum</div><div class="slogan"></div><div class="progress"><div class="bar"></div></div></div><main><nav class="nav"><div class="brand">ERETHEUM</div><div class="links"><a class="pill" href="stats.html">STATS</a><a class="pill" href="games.html">GAMES</a><a class="pill" href="settings.html">SETTINGS</a></div></nav><section class="hero"><div><h1>erethreum</h1><div class="sub">a small place for games</div><div class="actions"><a class="pill primary" href="games.html">browse games →</a><button class="pill" id="random">smart random ↗</button></div></div></section><section class="section" id="continueSection" hidden><div class="section-head"><h2>CONTINUE PLAYING</h2><a class="more" href="games.html?sort=recent">view activity →</a></div><div class="cards" id="continue"></div></section><section class="section" id="popularSection"><div class="section-head"><h2>POPULAR</h2><a class="more" href="games.html?sort=popular">view all →</a></div><div class="cards" id="popular"></div></section><section class="section" id="newSection"><div class="section-head"><h2>NEW ARRIVALS</h2><a class="more" href="games.html?sort=new">view all →</a></div><div class="cards" id="new"></div></section><section class="section" id="favoriteSection" hidden><div class="section-head"><h2>FAVORITES</h2><a class="more" href="games.html?filter=favorites">view all →</a></div><div class="cards" id="favorites"></div></section><section class="section" id="quickSection"><div class="section-head"><h2>QUICK PLAYS</h2><a class="more" href="games.html">full library →</a></div><div class="cards" id="quick"></div></section></main><div class="version">ERETHEUM / 2.0</div><script src="system/games.js"></script><script>window.addEventListener("load",()=>document.body.classList.add("loaded"));const messages=["welcome to erethreum.","system online.","erethreum initialized.","games ready."];document.querySelector(".slogan").textContent=messages[Math.floor(Math.random()*messages.length)];const starContainer=document.getElementById("stars");for(let i=0;i<120;i++){const star=document.createElement("div");star.className="star";const size=Math.random()*2;star.style.width=size+"px";star.style.height=size+"px";star.style.top=Math.random()*100+"%";star.style.left=Math.random()*100+"%";star.style.animationDelay=Math.random()*4+"s";starContainer.appendChild(star)}const firstVisit=!sessionStorage.getItem("erethreum-visited");if(firstVisit){sessionStorage.setItem("erethreum-visited","1");setTimeout(()=>{document.getElementById("boot").style.opacity="0";setTimeout(()=>document.getElementById("boot").remove(),500)},2000)}else document.getElementById("boot").remove();const favKey="erethreum-favorites",recentKey="erethreum-recent",playKey="erethreum-play-counts";const read=k=>{try{return JSON.parse(localStorage.getItem(k)||"{}")}catch{return{}}},getArr=k=>{try{return JSON.parse(localStorage.getItem(k)||"[]")}catch{return[]}};const fav=()=>getArr(favKey),recent=()=>getArr(recentKey),counts=()=>read(playKey);function card(g){return '<div class="card"><a href="play.html?id='+encodeURIComponent(g.id)+'"><img class="thumb" src="https://cdn.jsdelivr.net/gh/3kh0/3kh0-lite@main/'+g.image+'" alt="" loading="lazy"><div class="card-info"><div class="title">'+g.title+'</div><div class="tag">'+g.tag+'</div></div></a></div>'}function bind(){document.querySelectorAll(".fav").forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();let a=fav();a=a.includes(b.dataset.id)?a.filter(x=>x!==b.dataset.id):[...a,b.dataset.id];localStorage.setItem(favKey,JSON.stringify(a));render()})}function render(){const f=fav(),r=recent(),c=counts(),popular=[...games].sort((a,b)=>(c[b.id]||0)-(c[a.id]||0)||a.title.localeCompare(b.title)).slice(0,6),latest=games.slice(-6).reverse(),quick=[...games].filter(g=>(c[g.id]||0)<2).sort(()=>Math.random()-.5).slice(0,6),rec=r.map(id=>games.find(g=>g.id===id)).filter(Boolean).slice(0,6),fs=f.map(id=>games.find(g=>g.id===id)).filter(Boolean).slice(0,6);document.getElementById("popular").innerHTML=popular.map(card).join("");document.getElementById("new").innerHTML=latest.map(card).join("");document.getElementById("quick").innerHTML=quick.map(card).join("");document.getElementById("continue").innerHTML=rec.map(card).join("");document.getElementById("favorites").innerHTML=fs.map(card).join("");document.getElementById("continueSection").hidden=!rec.length;document.getElementById("favoriteSection").hidden=!fs.length;bind()}function smartRandom(){const r=recent(),c=counts();let pool=games.filter(g=>!r.includes(g.id));if(!pool.length)pool=games;pool.sort((a,b)=>(c[a.id]||0)-(c[b.id]||0));const pick=pool[Math.floor(Math.random()*Math.min(12,pool.length))];location.href="play.html?id="+encodeURIComponent(pick.id)}document.getElementById("random").onclick=smartRandom;render();</script></body></html>
