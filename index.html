<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERETHEUM</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}body{overflow-x:hidden;opacity:0;transition:opacity .4s}.loaded{opacity:1}#stars{position:fixed;inset:0;z-index:0;pointer-events:none}.star{position:absolute;background:#fff;border-radius:50%;opacity:.35;animation:twinkle 4s infinite ease-in-out}@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.48}}
#boot{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10;transition:opacity .5s}.logo{font-size:42px;letter-spacing:14px}.slogan{margin-top:12px;font-size:14px;letter-spacing:3px;color:#aaa}.progress{width:180px;height:1px;background:#222;margin-top:25px}.bar{width:0;height:100%;background:#fff;animation:load 2s linear forwards}@keyframes load{to{width:100%}}
main{position:relative;z-index:2;min-height:100vh;padding:24px}.nav{display:flex;justify-content:space-between;align-items:center}.brand{font-size:12px;letter-spacing:5px}.links{display:flex;gap:8px}.pill{border:1px solid #222;border-radius:999px;padding:9px 13px;color:#999;text-decoration:none;font-size:10px;letter-spacing:1.5px;transition:.2s}.pill:hover{color:#fff;border-color:#666;transform:translateY(-1px)}.hero{min-height:58vh;display:grid;place-items:center;text-align:center}.hero h1{font-size:clamp(48px,9vw,84px);letter-spacing:18px;font-weight:300;margin:0}.sub{margin-top:12px;font-size:11px;letter-spacing:5px;color:#666}.actions{display:flex;justify-content:center;gap:8px;margin-top:24px;flex-wrap:wrap}.primary{color:#fff;border-color:#444}.section{max-width:1100px;margin:0 auto 45px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.section h2{font-size:10px;letter-spacing:4px;font-weight:400;color:#777}.section a.more{font-size:10px;color:#555;text-decoration:none}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}.card{background:#090909;border:1px solid #191919;border-radius:12px;overflow:hidden;color:#fff;text-decoration:none;transition:.2s;position:relative}.card:hover{transform:translateY(-3px);border-color:#444}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;filter:grayscale(.2)}.card-info{padding:10px 12px}.title{font-size:12px}.tag{font-size:9px;color:#666;margin-top:5px}.fav{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;border:1px solid #333;background:#050505;color:#aaa;cursor:pointer}.fav.on{color:#fff;border-color:#777}.empty{color:#444;font-size:11px;letter-spacing:1px}.version{position:fixed;right:14px;bottom:10px;color:#222;font-size:9px;letter-spacing:2px}
@media(max-width:600px){main{padding:16px}.links .pill:first-child{display:none}.hero{min-height:62vh}.hero h1{letter-spacing:9px}}
</style></head>
<body><div id="stars"></div><div id="boot"><div class="logo">erethreum</div><div class="slogan"></div><div class="progress"><div class="bar"></div></div></div>
<main><nav class="nav"><div class="brand">ERETHEUM</div><div class="links"><a class="pill" href="stats.html">STATS</a><a class="pill" href="games.html">GAMES</a></div></nav>
<section class="hero"><div><h1>erethreum</h1><div class="sub">a small place for games</div><div class="actions"><a class="pill primary" href="games.html">browse games →</a><button class="pill" id="random">random game ↗</button></div></div></section>
<section class="section" id="continueSection" hidden><div class="section-head"><h2>CONTINUE PLAYING</h2><a class="more" href="games.html">view library →</a></div><div class="cards" id="continue"></div></section>
<section class="section" id="favoriteSection" hidden><div class="section-head"><h2>FAVORITES</h2><a class="more" href="games.html?filter=favorites">view all →</a></div><div class="cards" id="favorites"></div></section>
</main><div class="version">ERETHEUM / 1.1</div>
<script src="system/games.js"></script><script>
window.addEventListener("load",()=>document.body.classList.add("loaded"));
const messages=["welcome to erethreum.","system online.","erethreum initialized.","games ready."];document.querySelector(".slogan").textContent=messages[Math.floor(Math.random()*messages.length)];
const stars=document.getElementById("stars");for(let i=0;i<120;i++){const s=document.createElement("div");s.className="star";const z=Math.random()*2;s.style.width=z+"px";s.style.height=z+"px";s.style.top=Math.random()*100+"%";s.style.left=Math.random()*100+"%";s.style.animationDelay=Math.random()*4+"s";stars.appendChild(s)}
const firstVisit=!sessionStorage.getItem("erethreum-visited");if(firstVisit){sessionStorage.setItem("erethreum-visited","1");setTimeout(()=>{document.getElementById("boot").style.opacity="0";setTimeout(()=>document.getElementById("boot").remove(),500)},2000)}else document.getElementById("boot").remove();
const keyFav="erethreum-favorites",keyRecent="erethreum-recent";const get=(k)=>{try{return JSON.parse(localStorage.getItem(k)||"[]")}catch{return[]}};const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
function card(g){return '<div class="card"><a href="play.html?id='+encodeURIComponent(g.id)+'"><img class="thumb" src="https://cdn.jsdelivr.net/gh/3kh0/3kh0-lite@main/'+g.image+'" alt="" loading="lazy"><div class="card-info"><div class="title">'+g.title+'</div><div class="tag">'+g.tag+'</div></div></a><button class="fav '+(get(keyFav).includes(g.id)?"on":"")+'" data-id="'+g.id+'" aria-label="Favorite '+g.title+'">☆</button></div>'}
function render(){const fav=get(keyFav),recent=get(keyRecent);const r=recent.map(id=>games.find(g=>g.id===id)).filter(Boolean).slice(0,3),f=fav.map(id=>games.find(g=>g.id===id)).filter(Boolean).slice(0,4);for(const [id,list] of [["continue",r],["favorites",f]]){const el=document.getElementById(id),sec=document.getElementById(id+"Section");sec.hidden=!list.length;el.innerHTML=list.map(card).join("")}document.querySelectorAll(".fav").forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();let a=get(keyFav);a=a.includes(b.dataset.id)?a.filter(x=>x!==b.dataset.id):[...a,b.dataset.id];save(keyFav,a);render()})}
document.getElementById("random").onclick=()=>{const g=games[Math.floor(Math.random()*games.length)];location.href="play.html?id="+encodeURIComponent(g.id)};render();
</script></body></html>
