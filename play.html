<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERETHEUM — GAME</title><script src="system/theme.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;overflow:hidden}.shell{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,var(--panel) 0,var(--bg) 55%,var(--bg) 100%)}.top{position:fixed;z-index:20;top:16px;left:18px;right:18px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:12px;letter-spacing:5px;color:var(--text);text-decoration:none}.controls{display:flex;gap:8px;align-items:center}.btn{font-size:11px;letter-spacing:1.5px;text-decoration:none;color:#a0a0a0;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--border);border-radius:999px;padding:9px 13px;backdrop-filter:blur(8px);transition:.2s}.btn:hover{color:var(--text);border-color:var(--accent)}.btn.action{cursor:pointer}.game-frame{position:fixed;inset:54px 18px 18px;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:#000;box-shadow:0 20px 70px rgba(0,0,0,.55)}iframe{width:100%;height:100%;border:0;display:block;background:#000}.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);color:#a0a0a0;font-size:11px;letter-spacing:4px;transition:opacity .25s;z-index:2}.loading.hide{opacity:0;pointer-events:none}.corner{position:fixed;right:20px;bottom:8px;color:#4a4a4a;font-size:11px;letter-spacing:2px;z-index:30}.info{position:fixed;left:24px;bottom:24px;z-index:25;max-width:330px;pointer-events:none}.info h1{font-size:15px;font-weight:400;letter-spacing:2px;margin:0 0 6px}.meta{font-size:10px;color:#a0a0a0;letter-spacing:1.5px}.info .line{margin-top:7px;color:#a0a0a0;font-size:10px}@media(max-width:600px){.top{left:10px;right:10px}.game-frame{inset:52px 8px 8px}.brand{letter-spacing:3px}.btn{padding:8px 10px}.info{left:14px;bottom:14px}}</style></head><body><div class="shell"></div><div class="top"><a class="brand" href="index.html">ERETHEUM</a><div class="controls"><a class="btn" href="games.html">GAMES</a><button class="btn action" id="reload">RELOAD</button><button class="btn action" id="full">FULLSCREEN</button><a class="btn" href="settings.html">SETTINGS</a></div></div><div class="game-frame"><div class="loading" id="loading">INITIALIZING</div><iframe id="game" allow="fullscreen;autoplay;gamepad" allowfullscreen></iframe></div><div class="info"><h1 id="gameTitle">GAME</h1><div class="meta" id="meta"></div><div class="line" id="time"></div></div><div class="corner">ERETHEUM / PLAY</div><script src="system/games.js"></script><script>
(function(){
try{["recent","play-counts","playtime","activity-days"].forEach(s=>localStorage.removeItem("erethreum-"+s))}catch(e){}
const p=new URLSearchParams(location.search),id=p.get("id"),game=games.find(g=>g.id===id);
const iframe=document.getElementById("game"),loading=document.getElementById("loading"),timeEl=document.getElementById("time");
const recentKey="eretheum-recent",playKey="eretheum-play-counts",timeKey="eretheum-playtime",daysKey="eretheum-activity-days",savePrefix="eretheum-save-";
let saveTimer=null,trackingTimer=null,lastTick=Date.now(),totalSeconds=0;
function read(key,fallback){try{const v=JSON.parse(localStorage.getItem(key)||"");return v&&typeof v==="object"?v:fallback}catch(e){return fallback}}
function write(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch(e){return false}}
function fmt(s){s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;return h?h+"h "+m+"m":m?m+"m":sec+"s"}
function bump(){
 const counts=read(playKey,{});counts[id]=Number(counts[id])>0?Number(counts[id])+1:1;write(playKey,counts);
 const times=read(timeKey,{});totalSeconds=Number(times[id])>0?Number(times[id]):0;times[id]=totalSeconds;write(timeKey,times);
 const recent=read(recentKey,[]);const r=Array.isArray(recent)?recent:[];
 write(recentKey,[id].concat(r.filter(x=>x!==id)).slice(0,12));
}
function tick(){
 if(!game)return;
 const now=Date.now(),elapsed=Math.max(0,(now-lastTick)/1000);lastTick=now;
 if(elapsed>0&&elapsed<120){
   totalSeconds+=elapsed;
   const times=read(timeKey,{});times[id]=totalSeconds;write(timeKey,times);
   const days=read(daysKey,{}),day=new Date().toISOString().slice(0,10);days[day]=(Number(days[day])>0?Number(days[day]):0)+elapsed;write(daysKey,days);
   timeEl.textContent="PLAYTIME · "+fmt(totalSeconds);
 }
}
function flush(){if(!game)return;tick();saveGameState()}
function saveGameState(){if(!game||!iframe.contentWindow||!game.save)return;try{const data={};const store=iframe.contentWindow.localStorage;for(let i=0;i<store.length;i++){const k=store.key(i);data[k]=store.getItem(k)}localStorage.setItem(savePrefix+game.id,JSON.stringify(data))}catch(e){}}
function restoreGameState(){if(!game||!game.save)return;try{const raw=localStorage.getItem(savePrefix+game.id);if(!raw)return;const data=JSON.parse(raw),store=iframe.contentWindow.localStorage;Object.keys(data).forEach(k=>store.setItem(k,data[k]))}catch(e){}}
if(!game){loading.textContent="GAME NOT FOUND"}
else{
 document.title="ERETHEUM — "+game.title;
 document.getElementById("gameTitle").textContent=game.title;
 document.getElementById("meta").textContent=game.tag+(game.save?" · SAVES":"");
 const existing=read(timeKey,{});totalSeconds=Number(existing[id])>0?Number(existing[id]):0;
 timeEl.textContent="PLAYTIME · "+fmt(totalSeconds);
 bump();
 iframe.src="games/"+game.id+"/index.html";
 trackingTimer=setInterval(tick,1000);
 iframe.addEventListener("load",function(){restoreGameState();loading.classList.add("hide");setTimeout(()=>loading.remove(),300);if(game.save){clearInterval(saveTimer);saveTimer=setInterval(saveGameState,2000)}});
 window.addEventListener("pagehide",flush);
 document.addEventListener("visibilitychange",function(){if(document.hidden)flush();else lastTick=Date.now()});
}
document.getElementById("reload").onclick=function(){if(game){flush();loading.classList.remove("hide");loading.textContent="RELOADING";iframe.src="games/"+game.id+"/index.html";lastTick=Date.now()}};
document.getElementById("full").onclick=function(){const f=document.querySelector(".game-frame");if(document.fullscreenElement)document.exitFullscreen();else if(f.requestFullscreen)f.requestFullscreen()};
})();
</script></body></html>
