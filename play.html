<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERETHREUM — GAME</title><style>html,body{margin:0;width:100%;height:100%;background:#070707;overflow:hidden}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.bar{position:fixed;z-index:9999;top:12px;left:12px;display:flex;gap:8px}.bar a{font:700 12px system-ui;text-decoration:none;padding:9px 13px;border-radius:5px}.brand{background:#8cff42;color:#071000}.back{background:#111;color:#8cff42;border:1px solid #8cff42}.loading{position:fixed;inset:0;display:grid;place-items:center;color:#8cff42;font:700 13px system-ui;letter-spacing:.14em}</style></head><body><div class="bar"><a class="brand" href="index.html">ERETHREUM</a><a class="back" href="games.html">← GAMES</a></div><div class="loading" id="loading">LOADING GAME</div><iframe id="game" allow="fullscreen;autoplay;gamepad" allowfullscreen></iframe><script src="system/games.js"></script><script>const params=new URLSearchParams(location.search);const id=params.get("id");const game=games.find(g=>g.id===id);const iframe=document.getElementById("game");const loading=document.getElementById("loading");if(!game){loading.textContent="GAME NOT FOUND"}else{iframe.src="games/"+game.id+"/index.html";iframe.addEventListener("load",()=>loading.remove())}</script></body></html>
