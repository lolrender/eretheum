<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERETHEUM — GAME</title><script src="system/theme.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;overflow:hidden}.shell{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,var(--panel) 0,var(--bg) 55%,var(--bg) 100%)}.top{position:fixed;z-index:20;top:16px;left:18px;right:18px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:12px;letter-spacing:5px;color:var(--text);text-decoration:none}.controls{display:flex;gap:8px;align-items:center}.btn{font-size:10px;letter-spacing:1.5px;text-decoration:none;color:var(--muted);background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--border);border-radius:999px;padding:9px 13px;backdrop-filter:blur(8px);transition:.2s}.btn:hover{color:var(--text);border-color:var(--accent)}.btn.action{cursor:pointer}.game-frame{position:fixed;inset:54px 18px 18px;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:#000;box-shadow:0 20px 70px rgba(0,0,0,.55)}iframe{width:100%;height:100%;border:0;display:block;background:#000}.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--muted);font-size:10px;letter-spacing:4px;transition:opacity .25s;z-index:2}.loading.hide{opacity:0;pointer-events:none}.corner{position:fixed;right:20px;bottom:8px;color:var(--border);font-size:9px;letter-spacing:2px;z-index:30}.info{position:fixed;left:24px;bottom:24px;z-index:25;max-width:330px;pointer-events:none}.info h1{font-size:15px;font-weight:400;letter-spacing:2px;margin:0 0 6px}.meta{font-size:9px;color:var(--muted);letter-spacing:1.5px}.info .line{margin-top:7px;color:var(--muted);font-size:9px}.related{position:fixed;left:24px;bottom:75px;z-index:25;display:flex;gap:6px;pointer-events:auto}.related a{font-size:8px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:6px 8px;text-decoration:none;background:var(--panel)}.related a:hover{color:var(--text);border-color:var(--accent)}@media(max-width:600px){.top{left:10px;right:10px}.game-frame{inset:52px 8px 8px}.brand{letter-spacing:3px}.btn{padding:8px 10px}.info{left:14px;bottom:14px}.related{left:14px;bottom:65px;max-width:calc(100% - 28px);overflow:hidden}}
</style></head><body><div class="shell"></div><div class="top"><a class="brand" href="index.html">ERETHEUM</a><div class="controls"><a class="btn" href="games.html">GAMES</a><button class="btn action" id="reload">RELOAD</button><button class="btn action" id="full">FULLSCREEN</button><a class="btn" href="settings.html">SETTINGS</a></div></div><div class="game-frame"><div class="loading" id="loading">INITIALIZING</div><iframe id="game" allow="fullscreen;autoplay;gamepad" allowfullscreen></iframe></div><div class="info"><h1 id="gameTitle">GAME</h1><div class="meta" id="meta"></div><div class="line" id="time"></div><div class="line" id="controls">CONTROLS · KEYBOARD / MOUSE / TOUCH — GAME DEPENDENT</div></div><div class="related" id="related"></div><div class="corner">ERETHEUM / PLAY</div><script src="system/games.js"></script><script>const p=new URLSearchParams(location.search),id=p.get("id"),game=games.find(g=>g.id===id),iframe=document.getElementById("game"),loading=document.getElementById("loading"),recentKey="erethreum-recent",playKey="erethreum-play-counts",timeKey="erethreum-playtime",savePrefix="erethreum-save-";let saveTimer,timeTimer,start=Date.now();const fmt=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;return (h?h+"h ":"")+(m?m+"m ":"")+sec+"s"};function bump(){const counts=(()=>{try{return JSON.parse(localStorage.getItem(playKey)||"{}")}catch{return{}}})();counts[id]=(counts[id]||0)+1;localStorage.setItem(playKey,JSON.stringify(counts));const times=(()=>{try{return JSON.parse(localStorage.getItem(timeKey)||"{}")}catch{return{}}})();times[id]=times[id]||0;localStorage.setItem(timeKey,JSON.stringify(times))}function tick(){if(!game)return;try{const t=JSON.parse(localStorage.getItem(timeKey)||"{}");t[id]=(t[id]||0)+(Date.now()-start)/1000;localStorage.setItem(timeKey,JSON.stringify(t));start=Date.now();document.getElementById("time").textContent="PLAYTIME · "+fmt(t[id])}catch{}}function saveGameState(){if(!game||!iframe.contentWindow)return;try{const data={};for(let i=0;i<iframe.contentWindow.localStorage.length;i++){const k=iframe.contentWindow.localStorage.key(i);data[k]=iframe.contentWindow.localStorage.getItem(k)}localStorage.setItem(savePrefix+game.id,JSON.stringify(data))}catch{}}function restoreGameState(){if(!game)return;try{const raw=localStorage.getItem(savePrefix+game.id);if(!raw)return;const data=JSON.parse(raw);for(const [k,v] of Object.entries(data))iframe.contentWindow.localStorage.setItem(k,v)}catch{}}if(!game)loading.textContent="GAME NOT FOUND";else{document.title="ERETHEUM — "+game.title;document.getElementById("gameTitle").textContent=game.title;document.getElementById("meta").textContent=game.tag+(game.save?" · SAVES":"");iframe.src="games/"+game.id+"/index.html";let r=[];try{r=JSON.parse(localStorage.getItem(recentKey)||"[]")}catch{}r=[game.id,...r.filter(x=>x!==game.id)].slice(0,12);localStorage.setItem(recentKey,JSON.stringify(r));bump();timeTimer=setInterval(tick,1000);iframe.addEventListener("load",()=>{restoreGameState();loading.classList.add("hide");setTimeout(()=>loading.remove(),300);clearInterval(saveTimer);if(game.save)saveTimer=setInterval(saveGameState,2000)});window.addEventListener("pagehide",()=>{tick();saveGameState()});const related=games.filter(g=>g.id!==game.id&&g.tag===game.tag).slice(0,3);document.getElementById("related").innerHTML=related.map(g=>'<a href="play.html?id='+encodeURIComponent(g.id)+'">more like '+g.title+'</a>').join("")}document.getElementById("reload").onclick=()=>{if(game){loading.classList.remove("hide");loading.textContent="RELOADING";iframe.src="games/"+game.id+"/index.html";start=Date.now()}};document.getElementById("full").onclick=()=>{const f=document.querySelector(".game-frame");if(document.fullscreenElement)document.exitFullscreen();else f.requestFullscreen?.()};</script></body></html>
