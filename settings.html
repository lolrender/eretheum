<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERETHEUM / settings</title><script src="system/theme.js"></script><style>*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;transition:background .2s,color .2s}.wrap{max-width:820px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;margin-bottom:65px}.back{color:#a0a0a0;text-decoration:none;font-size:11px}.brand{font-size:12px;letter-spacing:5px}.label{font-size:11px;letter-spacing:5px;color:#a0a0a0}h1{font-weight:300;font-size:clamp(42px,8vw,72px);letter-spacing:12px;margin:12px 0 45px}.panel{border:1px solid var(--border);border-radius:14px;background:var(--panel);padding:20px;margin-bottom:16px}.panel h2{font-size:11px;letter-spacing:4px;color:#a0a0a0;font-weight:400;margin:0 0 16px}.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.theme{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;color:var(--text);cursor:pointer;text-align:left}.theme:hover,.theme.active{border-color:var(--accent)}.swatch{height:42px;border-radius:8px;margin-bottom:12px;border:1px solid var(--border)}.theme b{font-size:11px}.theme span{display:block;color:#a0a0a0;font-size:11px;margin-top:5px}.row{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid var(--border);font-size:11px}.row:last-child{border:0}.small{color:#a0a0a0;font-size:11px;line-height:1.6}.danger{margin-top:8px;background:none;border:1px solid var(--border);border-radius:999px;color:#a0a0a0;padding:10px 13px;font-size:11px;cursor:pointer}.danger:hover{color:var(--text);border-color:var(--accent)}@media(max-width:600px){.wrap{padding:16px}.top{margin-bottom:45px}h1{letter-spacing:7px}} </style></head><body><div class="wrap"><div class="top"><a class="back" href="index.html">← home</a><div class="brand">ERETHEUM / SETTINGS</div></div><div class="label">PREFERENCES</div><h1>settings</h1><div class="panel"><h2>COLOR THEMES</h2><div class="themes" id="themes"></div></div><div class="panel"><h2>LOCAL DATA</h2><div class="row"><span>PROFILE</span><span class="small">stored in this browser</span></div><div class="row"><span>THEME</span><span class="small" id="current"></span></div><button class="danger" id="reset">RESET THEME</button></div></div><script>const names={default:"Void",ocean:"Ocean",violet:"Violet",amber:"Amber",rose:"Rose",ice:"Ice",mono:"Mono"};const themes=window.ERETHEUM_THEMES,el=document.getElementById("themes"),key="erethreum-theme";function render(){const active=localStorage.getItem(key)||"default";document.getElementById("current").textContent=names[active]||"Void";el.innerHTML=Object.entries(names).map(([id,n])=>{const t=themes[id];return '<button class="theme '+(id===active?"active":"")+'" data-theme="'+id+'"><div class="swatch" style="background:'+t.bg+';box-shadow:inset 0 0 0 1px '+t.border+'"><span style="display:block;width:100%;height:100%;background:linear-gradient(135deg,transparent 45%, '+t.accent+' 46%, '+t.accent+' 50%,transparent 51%)"></span></div><b>'+n+'</b><span>'+id+'</span></button>'}).join("");document.querySelectorAll(".theme").forEach(b=>b.onclick=()=>{localStorage.setItem(key,b.dataset.theme);location.reload()})}document.getElementById("reset").onclick=()=>{localStorage.removeItem(key);location.reload()};render();</script></body></html>
