<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERETHEUM / system</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#ddd;font-family:monospace}body{padding:22px}.wrap{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;margin-bottom:70px}.brand{font:12px Arial;letter-spacing:5px}.back{color:#666;text-decoration:none;font:11px Arial}.terminal{border:1px solid #202020;border-radius:14px;background:#060606;overflow:hidden;box-shadow:0 30px 90px #000}.bar{height:36px;border-bottom:1px solid #181818;display:flex;align-items:center;padding:0 14px;color:#444;font:9px Arial;letter-spacing:3px}.body{padding:22px;min-height:440px}.line{color:#666;margin:0 0 10px;font-size:12px}.out{color:#aaa;margin:0 0 16px;line-height:1.7;font-size:12px}.prompt{display:flex;gap:8px}.prompt span{color:#666}.prompt input{flex:1;background:none;border:0;outline:0;color:#fff;font:12px monospace}.hint{margin-top:30px;color:#333;font-size:10px}@media(max-width:600px){body{padding:14px}.body{padding:16px}.top{margin-bottom:45px}}
</style></head><body><div class="wrap"><div class="top"><a class="back" href="index.html">← home</a><div class="brand">ERETHEUM / SYSTEM</div></div><div class="terminal"><div class="bar">LOCAL TERMINAL</div><div class="body" id="body"><p class="line">ERETHEUM SYSTEM TERMINAL v1.0</p><p class="out">Type <b>help</b> to see available commands.</p><div class="prompt"><span>$</span><input id="input" autofocus autocomplete="off" spellcheck="false"></div><div class="hint">local only · no commands leave your browser</div></div></div></div>
<script src="system/games.js"></script><script>
const input=document.getElementById("input"),body=document.getElementById("body");
function recent(){try{return JSON.parse(localStorage.getItem("erethreum-recent")||"[]")}catch{return[]}}
function run(cmd){const c=cmd.trim().toLowerCase(),r=recent();let out="";
if(c==="help")out="games — list games\nrandom — launch a random game\nfavorites — show favorites\nstats — open statistics\nclear — clear terminal";
else if(c==="games")out=games.map(g=>g.title).join("\n");
else if(c==="favorites"){let f=[];try{f=JSON.parse(localStorage.getItem("erethreum-favorites")||"[]")}catch{};out=f.length?f.map(id=>games.find(g=>g.id===id)?.title).filter(Boolean).join("\n"):"no favorites yet";}
else if(c==="stats")location.href="stats.html";
else if(c==="random"){const g=games[Math.floor(Math.random()*games.length)];location.href="play.html?id="+encodeURIComponent(g.id);return;}
else if(c==="clear"){document.querySelectorAll(".cmd").forEach(x=>x.remove());return;}
else if(!c){return}else{const g=games.find(x=>x.title.toLowerCase()===c||x.id.toLowerCase()===c);if(g){location.href="play.html?id="+encodeURIComponent(g.id);return}out="command not found — type help";}
const p=document.createElement("p");p.className="out cmd";p.textContent=out;body.insertBefore(p,body.querySelector(".prompt"));input.value="";
}
input.addEventListener("keydown",e=>{if(e.key==="Enter")run(input.value)});
</script></body></html>
