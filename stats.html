<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERETHEUM / stats</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;margin-bottom:60px}.back{color:#777;text-decoration:none;font-size:11px}.brand{font-size:12px;letter-spacing:5px}.label{font-size:10px;letter-spacing:5px;color:#555}.hero h1{font-weight:300;font-size:clamp(42px,8vw,72px);letter-spacing:12px;margin:12px 0 45px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.stat{border:1px solid #191919;border-radius:12px;padding:24px;background:#080808}.num{font-size:36px;font-weight:300}.name{margin-top:9px;font-size:9px;letter-spacing:3px;color:#555}.panel{margin-top:45px;border-top:1px solid #181818;padding-top:20px}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #111;font-size:11px}.muted{color:#555}.achievements{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:20px}.achievement{border:1px solid #191919;border-radius:12px;padding:16px;background:#080808;opacity:.35}.achievement.unlocked{opacity:1;border-color:#444}.achievement b{font-size:10px;letter-spacing:2px}.achievement p{margin:7px 0 0;color:#555;font-size:9px}.save-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.save-btn{color:#aaa;background:#080808;border:1px solid #222;border-radius:999px;padding:10px 13px;font-size:10px;letter-spacing:1px;cursor:pointer}.save-btn:hover{color:#fff;border-color:#555}.danger{margin-top:30px;color:#555;background:none;border:0;font-size:10px;letter-spacing:2px;cursor:pointer}
</style></head><body><div class="wrap"><div class="top"><a class="back" href="index.html">← home</a><div class="brand">ERETHEUM / STATS</div></div><div class="label">LOCAL PROFILE</div><div class="hero"><h1>activity</h1></div><div class="stats"><div class="stat"><div class="num" id="available">0</div><div class="name">GAMES AVAILABLE</div></div><div class="stat"><div class="num" id="played">0</div><div class="name">GAMES PLAYED</div></div><div class="stat"><div class="num" id="favorites">0</div><div class="name">FAVORITES</div></div><div class="stat"><div class="num" id="categories">0</div><div class="name">CATEGORIES</div></div></div><div class="panel"><div class="row"><span>RECENT ACTIVITY</span><span class="muted" id="recent">0</span></div><div class="row"><span>STORAGE</span><span class="muted">LOCAL ONLY</span></div><div class="save-tools"><button class="save-btn" id="export">EXPORT SAVES</button><label class="save-btn">IMPORT SAVES<input id="import" type="file" accept=".json,application/json" hidden></label></div></div><div class="panel"><div class="label">ACHIEVEMENTS</div><div class="achievements" id="achievements"></div></div><button class="danger" id="clear">CLEAR LOCAL ACTIVITY</button></div>
<script src="system/games.js"></script><script>
const read=k=>{try{return JSON.parse(localStorage.getItem(k)||"[]")}catch{return[]}},recent=read("erethreum-recent"),fav=read("erethreum-favorites");document.getElementById("available").textContent=games.length;document.getElementById("played").textContent=new Set(recent).size;document.getElementById("favorites").textContent=fav.length;document.getElementById("categories").textContent=new Set(games.map(g=>g.tag)).size;document.getElementById("recent").textContent=recent.length+" recent entries";
const achievements=[["FIRST CONTACT","Launch your first game.",new Set(recent).size>=1],["EXPLORER","Play 10 different games.",new Set(recent).size>=10],["ARCHIVIST","Favorite 10 games.",fav.length>=10],["COLLECTOR","Play 25 different games.",new Set(recent).size>=25],["LIBRARIAN","Favorite 25 games.",fav.length>=25],["DEEP SPACE","Play 50 different games.",new Set(recent).size>=50]];
document.getElementById("achievements").innerHTML=achievements.map(a=>'<div class="achievement '+(a[2]?"unlocked":"")+'"><b>'+a[0]+'</b><p>'+a[1]+'</p></div>').join("");
document.getElementById("export").onclick=()=>{const saves={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith("erethreum-save-"))saves[k]=localStorage.getItem(k)}const blob=new Blob([JSON.stringify(saves,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="erethreum-saves.json";a.click();URL.revokeObjectURL(a.href)};
document.getElementById("import").onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);Object.entries(data).forEach(([k,v])=>{if(k.startsWith("erethreum-save-"))localStorage.setItem(k,v)});alert("SAVES IMPORTED");}catch{alert("INVALID SAVE FILE")}};reader.readAsText(file)};
document.getElementById("clear").onclick=()=>{localStorage.removeItem("erethreum-recent");localStorage.removeItem("erethreum-favorites");location.reload()};
</script></body></html>
