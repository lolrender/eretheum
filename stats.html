<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERETHEUM / stats</title><script src="system/theme.js"></script><style>*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;margin-bottom:60px}.back{color:#a0a0a0;text-decoration:none;font-size:11px}.brand{font-size:12px;letter-spacing:5px}.label{font-size:11px;letter-spacing:5px;color:#a0a0a0}.hero h1{font-weight:300;font-size:clamp(42px,8vw,72px);letter-spacing:12px;margin:12px 0 45px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.stat{border:1px solid var(--border);border-radius:12px;padding:24px;background:var(--panel)}.num{font-size:36px;font-weight:300}.name{margin-top:9px;font-size:11px;letter-spacing:3px;color:#a0a0a0}.panel{margin-top:45px;border-top:1px solid var(--border);padding-top:20px}.row{display:flex;justify-content:space-between;gap:20px;padding:11px 0;border-bottom:1px solid var(--border);font-size:11px}.muted{color:#a0a0a0;text-align:right}.achievements{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:20px}.achievement{border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--panel);opacity:.4;transition:.2s}.achievement.unlocked{opacity:1;border-color:var(--accent)}.achievement b{font-size:11px;letter-spacing:2px}.achievement p{margin:7px 0 0;color:#a0a0a0;font-size:11px;line-height:1.5}.achievement small{display:block;margin-top:10px;color:#666;font-size:10px;letter-spacing:1px}.achievement.unlocked small{color:#a0a0a0}.save-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.save-btn{color:#a0a0a0;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:10px 13px;font-size:11px;letter-spacing:1px;cursor:pointer}.save-btn:hover{color:var(--text);border-color:var(--accent)}.heat{display:grid;grid-template-columns:repeat(26,1fr);gap:4px;margin-top:16px}.day{aspect-ratio:1;border-radius:3px;background:var(--panel);border:1px solid var(--border)}.day[data-v="1"]{background:color-mix(in srgb,var(--accent) 25%,var(--panel))}.day[data-v="2"]{background:color-mix(in srgb,var(--accent) 45%,var(--panel))}.day[data-v="3"]{background:color-mix(in srgb,var(--accent) 70%,var(--panel))}.day[data-v="4"]{background:var(--accent)}.heat-note{font-size:11px;color:#a0a0a0;margin-top:9px}.danger{margin-top:30px;color:#a0a0a0;background:none;border:0;font-size:11px;letter-spacing:2px;cursor:pointer}.danger:hover{color:var(--text)}@media(max-width:600px){.wrap{padding:16px}.heat{grid-template-columns:repeat(13,1fr)}.top{margin-bottom:45px}.brand{letter-spacing:3px}} </style></head><body><div class="wrap"><div class="top"><a class="back" href="index.html">← home</a><div class="brand">ERETHEUM / STATS</div></div><div class="label">LOCAL PROFILE</div><div class="hero"><h1>activity</h1></div><div class="stats"><div class="stat"><div class="num" id="available">0</div><div class="name">GAMES AVAILABLE</div></div><div class="stat"><div class="num" id="played">0</div><div class="name">GAMES PLAYED</div></div><div class="stat"><div class="num" id="favorites">0</div><div class="name">FAVORITES</div></div><div class="stat"><div class="num" id="categories">0</div><div class="name">CATEGORIES</div></div></div><div class="panel"><div class="row"><span>RECENT ACTIVITY</span><span class="muted" id="recent">0</span></div><div class="row"><span>TOTAL PLAYTIME</span><span class="muted" id="totalTime">0s</span></div><div class="row"><span>TOP GAME</span><span class="muted" id="topGame">—</span></div><div class="row"><span>STORAGE</span><span class="muted">LOCAL ONLY</span></div><div class="save-tools"><button class="save-btn" id="export">EXPORT SAVES</button><label class="save-btn">IMPORT SAVES<input id="import" type="file" accept=".json,application/json" hidden></label></div></div><div class="panel"><div class="label">ACTIVITY / LAST 26 WEEKS</div><div class="heat" id="heat"></div><div class="heat-note">Each square represents one day of local game activity.</div></div><div class="panel"><div class="label">ACHIEVEMENTS</div><div class="achievements" id="achievements"></div></div><button class="danger" id="clear">CLEAR LOCAL ACTIVITY</button></div><script src="system/games.js"></script><script>
(function(){
try{["favorites","recent","play-counts","playtime","activity-days"].forEach(s=>localStorage.removeItem("erethreum-"+s))}catch(e){}
const favKey="eretheum-favorites",recentKey="eretheum-recent",playKey="eretheum-play-counts",timeKey="eretheum-playtime",daysKey="eretheum-activity-days";
function arr(key){try{const v=JSON.parse(localStorage.getItem(key)||"[]");return Array.isArray(v)?v:[]}catch(e){return[]}}
function obj(key){try{const v=JSON.parse(localStorage.getItem(key)||"{}");return v&&typeof v==="object"&&!Array.isArray(v)?v:{}}catch(e){return{}}}
function n(v){const x=Number(v);return Number.isFinite(x)&&x>0?x:0}
const ids={};games.forEach(g=>ids[g.id]=g);
function render(){
 const favorites=arr(favKey).filter(id=>ids[id]),recent=arr(recentKey).filter(id=>ids[id]),counts=obj(playKey),times=obj(timeKey),days=obj(daysKey);
 const playedIds=Object.keys(counts).filter(id=>ids[id]&&n(counts[id])>0),playedCount=playedIds.length;
 const favoriteCount=new Set(favorites).size;
 let totalPlays=0,totalTime=0,topId=null,topCount=0;
 playedIds.forEach(id=>{const c=n(counts[id]);totalPlays+=c;if(c>topCount){topCount=c;topId=id}});
 Object.keys(times).forEach(id=>{if(ids[id])totalTime+=n(times[id])});
 let activeDays=0;Object.keys(days).forEach(k=>{if(n(days[k])>0)activeDays++});
 document.getElementById("available").textContent=games.length;
 document.getElementById("played").textContent=playedCount;
 document.getElementById("favorites").textContent=favoriteCount;
 document.getElementById("categories").textContent=new Set(games.map(g=>g.tag)).size;
 document.getElementById("recent").textContent=recent.length+" recent entries";
 function fmt(s){s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;return h?h+"h "+m+"m":m?m+"m":sec+"s"}
 document.getElementById("totalTime").textContent=fmt(totalTime);
 document.getElementById("topGame").textContent=topId?ids[topId].title:"—";
 const heat=document.getElementById("heat");heat.innerHTML="";const now=new Date();
 for(let i=181;i>=0;i--){const d=new Date(now);d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),v=Math.min(4,Math.floor(n(days[k]))),cell=document.createElement("div");cell.className="day";cell.dataset.v=v;cell.title=k+" · "+n(days[k])+" plays";heat.appendChild(cell)}
 const totalSec=Math.floor(totalTime);
 const achievementData=[
  ["FIRST CONTACT","Launch your first game.",playedCount,1,"game"],
  ["EXPLORER","Play 10 different games.",playedCount,10,"games"],
  ["ARCHIVIST","Favorite 10 games.",favoriteCount,10,"favorites"],
  ["COLLECTOR","Play 25 different games.",playedCount,25,"games"],
  ["LIFEFORM","Play 100 games total.",totalPlays,100,"plays"],
  ["LONGLONG","Spend 1 hour playing.",totalSec,3600,"seconds"],
  ["LUMINARY","Play on 7 different days.",activeDays,7,"days"],
  ["LIBRARIAN","Favorite 25 games.",favoriteCount,25,"favorites"],
  ["DEEP SPACE","Play 50 different games.",playedCount,50,"games"]
 ];
 document.getElementById("achievements").innerHTML=achievementData.map(a=>{
   const unlocked=a[2]>=a[3],shown=Math.min(a[2],a[3]);
   let progress;
   if(a[4]==="seconds") progress=fmt(a[2])+" / 1h";
   else progress=shown+" / "+a[3]+" "+a[4];
   return '<div class="achievement '+(unlocked?"unlocked":"")+'"><b>'+a[0]+'</b><p>'+a[1]+'</p><small>'+progress+(unlocked?" · UNLOCKED":"")+'</small></div>';
 }).join("");
}
render();
window.addEventListener("storage",render);
window.addEventListener("pageshow",render);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});
document.getElementById("export").onclick=function(){const data={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf("erethreum-save-")===0)data[k]=localStorage.getItem(k)}const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="erethreum-saves.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
document.getElementById("import").onchange=function(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(){try{const data=JSON.parse(reader.result);if(!data||typeof data!=="object"||Array.isArray(data))throw new Error();Object.keys(data).forEach(k=>{if(k.indexOf("erethreum-save-")===0)localStorage.setItem(k,String(data[k]))});alert("SAVES IMPORTED");render()}catch(err){alert("INVALID SAVE FILE")}};reader.readAsText(file)};
document.getElementById("clear").onclick=function(){if(!confirm("Clear local activity, favorites, playtime, and recent games?"))return;[recentKey,favKey,playKey,timeKey,daysKey,"erethreum-recent","erethreum-favorites","erethreum-play-counts","erethreum-playtime","erethreum-activity-days"].forEach(k=>localStorage.removeItem(k));render()};
})();
</script></body></html>
