<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERETHEUM / stats</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;margin-bottom:60px}.back{color:#777;text-decoration:none;font-size:11px}.brand{font-size:12px;letter-spacing:5px}.label{font-size:10px;letter-spacing:5px;color:#555}.hero h1{font-weight:300;font-size:clamp(42px,8vw,72px);letter-spacing:12px;margin:12px 0 45px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.stat{border:1px solid #191919;border-radius:12px;padding:24px;background:#080808}.num{font-size:36px;font-weight:300}.name{margin-top:9px;font-size:9px;letter-spacing:3px;color:#555}.panel{margin-top:45px;border-top:1px solid #181818;padding-top:20px}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #111;font-size:11px}.muted{color:#555}.danger{margin-top:30px;color:#555;background:none;border:0;font-size:10px;letter-spacing:2px;cursor:pointer}
</style></head><body><div class="wrap"><div class="top"><a class="back" href="index.html">← home</a><div class="brand">ERETHEUM / STATS</div></div><div class="label">LOCAL PROFILE</div><div class="hero"><h1>activity</h1></div><div class="stats"><div class="stat"><div class="num" id="available">0</div><div class="name">GAMES AVAILABLE</div></div><div class="stat"><div class="num" id="played">0</div><div class="name">GAMES PLAYED</div></div><div class="stat"><div class="num" id="favorites">0</div><div class="name">FAVORITES</div></div><div class="stat"><div class="num" id="categories">0</div><div class="name">CATEGORIES</div></div></div><div class="panel"><div class="row"><span>RECENT ACTIVITY</span><span class="muted" id="recent">0</span></div><div class="row"><span>STORAGE</span><span class="muted">LOCAL ONLY</span></div></div><button class="danger" id="clear">CLEAR LOCAL ACTIVITY</button></div>
<script src="system/games.js"></script><script>
const read=k=>{try{return JSON.parse(localStorage.getItem(k)||"[]")}catch{return[]}};const recent=read("erethreum-recent"),fav=read("erethreum-favorites");document.getElementById("available").textContent=games.length;document.getElementById("played").textContent=new Set(recent).size;document.getElementById("favorites").textContent=fav.length;document.getElementById("categories").textContent=new Set(games.map(g=>g.tag)).size;document.getElementById("recent").textContent=recent.length+" recent entries";document.getElementById("clear").onclick=()=>{localStorage.removeItem("erethreum-recent");localStorage.removeItem("erethreum-favorites");location.reload()};
</script></body></html>
