<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERETHEUM / stats</title><script src="system/theme.js"></script><style>*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;margin-bottom:60px}.back{color:#a0a0a0;text-decoration:none;font-size:11px}.brand{font-size:12px;letter-spacing:5px}.label{font-size:11px;letter-spacing:5px;color:#a0a0a0}.hero h1{font-weight:300;font-size:clamp(42px,8vw,72px);letter-spacing:12px;margin:12px 0 45px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.stat{border:1px solid var(--border);border-radius:12px;padding:24px;background:var(--panel)}.num{font-size:36px;font-weight:300}.name{margin-top:9px;font-size:11px;letter-spacing:3px;color:#a0a0a0}.panel{margin-top:45px;border-top:1px solid var(--border);padding-top:20px}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);font-size:11px}.muted{color:#a0a0a0}.achievements{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:20px}.achievement{border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--panel);opacity:.35}.achievement.unlocked{opacity:1;border-color:var(--accent)}.achievement b{font-size:11px;letter-spacing:2px}.achievement p{margin:7px 0 0;color:#a0a0a0;font-size:11px}.save-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.save-btn{color:#a0a0a0;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:10px 13px;font-size:11px;letter-spacing:1px;cursor:pointer}.save-btn:hover{color:var(--text);border-color:var(--accent)}.heat{display:grid;grid-template-columns:repeat(26,1fr);gap:4px;margin-top:16px}.day{aspect-ratio:1;border-radius:3px;background:var(--panel);border:1px solid var(--border);position:relative}.day[data-v="1"]{background:color-mix(in srgb,var(--accent) 25%,var(--panel))}.day[data-v="2"]{background:color-mix(in srgb,var(--accent) 45%,var(--panel))}.day[data-v="3"]{background:color-mix(in srgb,var(--accent) 70%,var(--panel))}.day[data-v="4"]{background:var(--accent)}.heat-note{font-size:11px;color:#a0a0a0;margin-top:9px}.danger{margin-top:30px;color:#a0a0a0;background:none;border:0;font-size:11px;letter-spacing:2px;cursor:pointer}@media(max-width:600px){.wrap{padding:16px}.heat{grid-template-columns:repeat(13,1fr)}} </style></head><body><div class="wrap"><div class="top"><a class="back" href="index.html">← home</a><div class="brand">ERETHEUM / STATS</div></div><div class="label">LOCAL PROFILE</div><div class="hero"><h1>activity</h1></div><div class="stats"><div class="stat"><div class="num" id="available">0</div><div class="name">GAMES AVAILABLE</div></div><div class="stat"><div class="num" id="played">0</div><div class="name">GAMES PLAYED</div></div><div class="stat"><div class="num" id="favorites">0</div><div class="name">FAVORITES</div></div><div class="stat"><div class="num" id="categories">0</div><div class="name">CATEGORIES</div></div></div><div class="panel"><div class="row"><span>RECENT ACTIVITY</span><span class="muted" id="recent">0</span></div><div class="row"><span>TOTAL PLAYTIME</span><span class="muted" id="totalTime">0s</span></div><div class="row"><span>TOP GAME</span><span class="muted" id="topGame">—</span></div><div class="row"><span>STORAGE</span><span class="muted">LOCAL ONLY</span></div><div class="save-tools"><button class="save-btn" id="export">EXPORT SAVES</button><label class="save-btn">IMPORT SAVES<input id="import" type="file" accept=".json,application/json" hidden></label></div></div><div class="panel"><div class="label">ACTIVITY / LAST 26 WEEKS</div><div class="heat" id="heat"></div><div class="heat-note">Each square represents one day of local game activity.</div></div><div class="panel"><div class="label">ACHIEVEMENTS</div><div class="achievements" id="achievements"></div></div><button class="danger" id="clear">CLEAR LOCAL ACTIVITY</button></div><script src="system/games.js"></script><script>const read=k=>{try{return JSON.parse(localStorage.getItem(k)||"[]")}catch{return[]}},obj=k=>{try{return JSON.parse(localStorage.getItem(k)||"{}")}catch{return{}}},recent=read("erethreum-recent"),fav=read("erethreum-favorites"),times=obj("erethreum-playtime"),counts=obj("erethreum-play-counts"),dates=obj("erethreum-activity-days");document.getElementById("available").textContent=games.length;document.getElementById("played").textContent=new Set(recent).size;document.getElementById("favorites").textContent=fav.length;document.getElementById("categories").textContent=new Set(games.map(g=>g.tag)).size;document.getElementById("recent").textContent=recent.length+" recent entries";const total=Object.values(times).reduce((a,b)=>a+Number(b||0),0),fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+"h "+m+"m":m?m+"m":s+"s"};document.getElementById("totalTime").textContent=fmt(total);const top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];document.getElementById("topGame").textContent=top?(games.find(g=>g.id===top[0])?.title||top[0]):"—";const heat=document.getElementById("heat"),now=new Date();for(let i=181;i>=0;i--){const d=new Date(now);d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const key=d.toISOString().slice(0,10),v=Math.min(4,Number(dates[key]||0));const x=document.createElement("div");x.className="day";x.dataset.v=v;x.title=key+" · "+(dates[key]||0)+" plays";heat.appendChild(x)}const achievements=[["FIRST CONTACT","Launch your first game.",Object.keys(counts).length>=1],["EXPLORER","Play 10 different games.",Object.keys(counts).length>=10],["ARCHIVIST","Favorite 10 games.",fav.length>=10],["COLLECTOR","Play 25 different games.",Object.keys(counts).length>=25],["LIBRARIAN","Favorite 25 games.",fav.length>=25],["DEEP SPACE","Play 50 different games.",Object.keys(counts).length>=50]];document.getElementById("achievements").innerHTML=achievements.map(a=>'<div class="achievement '+(a[2]?"unlocked":"")+'"><b>'+a[0]+'</b><p>'+a[1]+'</p></div>').join("");document.getElementById("export").onclick=()=>{const saves={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith("erethreum-save-"))saves[k]=localStorage.getItem(k)}const blob=new Blob([JSON.stringify(saves,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="erethreum-saves.json";a.click();URL.revokeObjectURL(a.href)};document.getElementById("import").onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);Object.entries(data).forEach(([k,v])=>{if(k.startsWith("erethreum-save-"))localStorage.setItem(k,v)});alert("SAVES IMPORTED")}catch{alert("INVALID SAVE FILE")}};reader.readAsText(file)};document.getElementById("clear").onclick=()=>{["erethreum-recent","erethreum-favorites","erethreum-play-counts","erethreum-playtime","erethreum-activity-days"].forEach(k=>localStorage.removeItem(k));location.reload()};</script></body></html>
