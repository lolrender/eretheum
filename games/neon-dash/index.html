<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Dash — Erethereum</title><link rel="stylesheet" href="../../styles/style.css"></head><body><header><a class="logo" href="../../index.html">ERETHEREUM</a><nav><a href="../../games.html">Games</a></nav></header><main class="section"><p class="eyebrow">ARCADE / 001</p><h1>NEON DASH</h1><p class="lead">Use A/D or the arrow keys to dodge the falling blocks. Survive as long as you can.</p><canvas id="game" width="800" height="450" style="width:100%;max-width:800px;background:#090b09;border:1px solid #292929"></canvas><p id="score" style="color:#8cff42">Score: 0</p><p style="color:#777">Press R to restart.</p></main><script>
const c=document.getElementById("game"),x=c.getContext("2d"),scoreEl=document.getElementById("score");let p,blocks,score,running,keys={};function reset(){p={x:380,y:390,w:40,h:24,s:7};blocks=[];score=0;running=true}function loop(){x.clearRect(0,0,c.width,c.height);x.fillStyle="#8cff42";x.fillRect(p.x,p.y,p.w,p.h);if(Math.random()<.035)blocks.push({x:Math.random()*760,y:-30,w:20+Math.random()*35,h:20+Math.random()*35,s:3+Math.random()*3});for(const b of blocks){b.y+=b.s;x.fillStyle="#f4f4f0";x.fillRect(b.x,b.y,b.w,b.h);if(b.y>450)b.dead=true;if(p.x<b.x+b.w&&p.x+p.w>b.x&&p.y<b.y+b.h&&p.y+p.h>b.y)running=false}blocks=blocks.filter(b=>!b.dead);if(running){if(keys.ArrowLeft||keys.a)p.x-=p.s;if(keys.ArrowRight||keys.d)p.x+=p.s;p.x=Math.max(0,Math.min(760,p.x));score++;scoreEl.textContent="Score: "+score}else{x.fillStyle="#8cff42";x.font="bold 38px system-ui";x.fillText("GAME OVER",300,220)}requestAnimationFrame(loop)}addEventListener("keydown",e=>{keys[e.key]=true;if(e.key.toLowerCase()==="r")reset()});addEventListener("keyup",e=>keys[e.key]=false);reset();loop();
</script></body></html>
